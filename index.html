<!DOCTYPE html>
<html lang="en" class="dark h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacation Dashboard 2026</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb' }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🇮🇹</span>
        <div>
          <h1 class="font-bold text-lg leading-tight">Summer Vacation 2026</h1>
          <p class="text-xs text-slate-400">Rome & Pisa | Aug 10 - Aug 15</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="exportData()" title="Backup / Export Data" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300">
          📥 Export
        </button>
        <label title="Restore / Import Data" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 cursor-pointer">
          📤 Import
          <input type="file" id="importInput" accept=".json" class="hidden" onchange="importData(event)">
        </label>
      </div>
    </div>
  </header>

  <!-- Filter & Actions Bar -->
  <main class="flex-1 max-w-3xl w-full mx-auto p-4 space-y-4 pb-24">
    <div class="flex items-center justify-between gap-2">
      <div class="flex space-x-1 bg-slate-800 p-1 rounded-xl border border-slate-700/50 overflow-x-auto">
        <button onclick="filterCategory('UPCOMING')" class="filter-btn active px-3 py-1.5 rounded-lg text-xs font-medium transition bg-brand-600 text-white whitespace-nowrap" id="filter-UPCOMING">Upcoming</button>
        <button onclick="filterCategory('TODAY')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition whitespace-nowrap" id="filter-TODAY">Today</button>
        <button onclick="filterCategory('ALL')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition whitespace-nowrap" id="filter-ALL">All</button>
      </div>

      <button onclick="openModal()" class="px-3 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-xs font-semibold text-white shadow-lg shadow-brand-500/20 whitespace-nowrap shrink-0">
        + Add Event
      </button>
    </div>

    <div class="flex space-x-1 bg-slate-800/60 p-1 rounded-xl border border-slate-700/40 overflow-x-auto w-fit max-w-full">
      <button onclick="filterCategory('FLIGHT')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition whitespace-nowrap" id="filter-FLIGHT">✈️ Flights</button>
      <button onclick="filterCategory('TRAIN')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition whitespace-nowrap" id="filter-TRAIN">🚆 Trains</button>
      <button onclick="filterCategory('ACTIVITY')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition whitespace-nowrap" id="filter-ACTIVITY">🏛️ Sights</button>
    </div>

    <!-- Timeline Container -->
    <div id="timeline" class="space-y-4 relative before:absolute before:inset-0 before:left-4 before:w-0.5 before:bg-slate-800">
      <!-- Injected by JavaScript -->
    </div>
  </main>

  <!-- Add/Edit Event Modal -->
  <div id="eventModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-lg" id="modalTitle">Add New Event</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 text-xl font-bold">&times;</button>
      </div>
      <form id="eventForm" onsubmit="saveEvent(event)" class="space-y-3">
        <input type="hidden" id="eventId">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Title</label>
          <input type="text" id="eventTitle" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Type</label>
            <select id="eventType" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
              <option value="FLIGHT">✈️ Flight</option>
              <option value="TRAIN">🚆 Train</option>
              <option value="BUS">🚌 Bus</option>
              <option value="ACTIVITY">🏛️ Activity/Sight</option>
              <option value="HOTEL">🏨 Hotel</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Date</label>
            <input type="date" id="eventDate" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Start Time</label>
            <input type="time" id="eventTime" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">End / Return Time (Optional)</label>
            <input type="time" id="eventEndTime" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Location / Route</label>
          <input type="text" id="eventLocation" placeholder="e.g. Brussels -> Fiumicino" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Notes / Booking Refs</label>
          <textarea id="eventNotes" rows="2" placeholder="e.g. Booking ref, seat numbers, tips..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500"></textarea>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-slate-800 text-xs font-medium text-slate-300">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-xs font-medium text-white">Save Event</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Event Detail Full View Modal -->
  <div id="eventDetailModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 w-full sm:max-w-lg max-h-[90vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-start border-b border-slate-800 pb-3 gap-3">
        <div class="min-w-0">
          <span id="detailTypeBadge" class="inline-block text-[10px] font-bold uppercase tracking-wider text-brand-500 px-2 py-0.5 rounded bg-brand-500/10 mb-2"></span>
          <h3 class="font-bold text-lg leading-snug" id="detailTitle"></h3>
        </div>
        <button onclick="closeEventDetail()" class="text-slate-400 hover:text-slate-200 text-xl font-bold shrink-0">&times;</button>
      </div>

      <div class="space-y-3 text-sm">
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700/50">
            <p class="text-[10px] uppercase tracking-wider text-slate-500 font-medium mb-1">Date</p>
            <p id="detailDate" class="text-slate-100 font-medium"></p>
          </div>
          <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700/50">
            <p class="text-[10px] uppercase tracking-wider text-slate-500 font-medium mb-1">Time</p>
            <p id="detailTime" class="text-slate-100 font-medium"></p>
          </div>
        </div>

        <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700/50">
          <p class="text-[10px] uppercase tracking-wider text-slate-500 font-medium mb-1">Location / Route</p>
          <p id="detailLocation" class="text-slate-100"></p>
        </div>

        <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700/50">
          <p class="text-[10px] uppercase tracking-wider text-slate-500 font-medium mb-1">Notes / Booking Refs</p>
          <p id="detailNotes" class="text-slate-300 whitespace-pre-wrap"></p>
        </div>

        <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700/50">
          <div class="flex items-center justify-between gap-2 mb-2">
            <p class="text-[10px] uppercase tracking-wider text-slate-500 font-medium">Attachments</p>
            <div class="flex items-center gap-1.5">
              <button type="button" onclick="openLinkModal(currentDetailEventId)" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg text-slate-200 border border-slate-600">🔗 Link</button>
              <label class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg cursor-pointer text-slate-200 border border-slate-600">
                📎 File
                <input type="file" id="detailVoucherInput" class="hidden" accept="image/*,application/pdf" multiple onchange="uploadVoucherFromDetail(event)">
              </label>
            </div>
          </div>
          <div id="detailVoucherStatus" class="text-xs text-slate-400 space-y-1.5">Loading...</div>
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-2 border-t border-slate-800">
        <button type="button" onclick="deleteEventFromDetail()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-red-900/40 text-xs font-medium text-red-400">Delete</button>
        <button type="button" onclick="editEventFromDetail()" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-xs font-medium text-white">Edit Event</button>
      </div>
    </div>
  </div>

  <!-- Add Link Modal -->
  <div id="linkModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[60] flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-lg">Add Link</h3>
        <button onclick="closeLinkModal()" class="text-slate-400 hover:text-slate-200 text-xl font-bold">&times;</button>
      </div>
      <form id="linkForm" onsubmit="saveLinkAttachment(event)" class="space-y-3">
        <input type="hidden" id="linkEventId">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">URL</label>
          <input type="url" id="linkUrl" required placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Label (optional)</label>
          <input type="text" id="linkLabel" placeholder="e.g. Booking confirmation" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeLinkModal()" class="px-4 py-2 rounded-lg bg-slate-800 text-xs font-medium text-slate-300">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-xs font-medium text-white">Save Link</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Document Preview Modal -->
  <div id="docModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[70] flex flex-col hidden">
    <div class="flex items-center justify-between p-4 bg-slate-900 border-b border-slate-800">
      <h3 class="font-bold text-sm" id="docModalTitle">Attachment Preview</h3>
      <button onclick="closeDocModal()" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
    </div>
    <div class="flex-1 p-2 flex items-center justify-center overflow-auto" id="docPreviewContainer">
      <!-- Rendered image or iframe -->
    </div>
  </div>

  <!-- IndexedDB & App Script -->
  <script>
    // Initial pre-loaded itinerary data
    const initialEvents = [
      { id: '1', title: 'Brussels to Rome Fiumicino Flight', type: 'FLIGHT', date: '2026-08-10', time: '08:50', location: 'Brussels Airport (BRU) ✈️ Fiumicino (FCO)', notes: 'Check-in online 24h before. Take Leonardo Express train upon arrival.' },
      { id: '2', title: 'Colosseum, Palatine Hill & Roman Forum', type: 'ACTIVITY', date: '2026-08-11', time: '10:30', location: 'Piazza del Colosseo, Roma', notes: 'Arrive 25 mins early for security checks.' },
      { id: '3', title: 'Day Trip to Pisa', type: 'TRAIN', date: '2026-08-13', time: '06:42', endTime: '20:38', location: 'Roma Termini ↔ Pisa Centrale', notes: 'Outbound train at 06:42. Return train leaves Pisa at 20:38.' },
      { id: '4', title: 'Rome Fiumicino to Brussels Flight', type: 'FLIGHT', date: '2026-08-15', time: '18:10', location: 'Fiumicino (FCO) ✈️ Brussels (BRU)', notes: 'Ferragosto holiday! Expect crowds; arrive at FCO airport by 15:30.' }
    ];

    let currentFilter = 'UPCOMING';
    let currentDetailEventId = null;
    let db;

    // Open IndexedDB (v2: unlimited attachments per event + links)
    const request = indexedDB.open('VacationAppDB', 2);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      const tx = e.target.transaction;

      if (!db.objectStoreNames.contains('vouchers')) {
        db.createObjectStore('vouchers', { keyPath: 'eventId' });
      }

      if (!db.objectStoreNames.contains('attachments')) {
        const store = db.createObjectStore('attachments', { keyPath: 'id' });
        store.createIndex('eventId', 'eventId', { unique: false });
      }

      // Migrate legacy single-voucher records into attachments
      if (tx.objectStoreNames.contains('vouchers') && tx.objectStoreNames.contains('attachments')) {
        const legacy = tx.objectStore('vouchers');
        const attachments = tx.objectStore('attachments');
        legacy.openCursor().onsuccess = (ev) => {
          const cursor = ev.target.result;
          if (!cursor) return;
          const v = cursor.value;
          attachments.put({
            id: `legacy-${v.eventId}`,
            eventId: v.eventId,
            kind: 'file',
            fileName: v.fileName || 'Voucher',
            fileType: v.fileType || 'application/octet-stream',
            dataUrl: v.dataUrl || '',
            createdAt: Date.now()
          });
          cursor.continue();
        };
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      initApp();
    };

    function initApp() {
      if (!localStorage.getItem('vacation_events')) {
        localStorage.setItem('vacation_events', JSON.stringify(initialEvents));
      }
      renderTimeline();
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeUrl(url) {
      const trimmed = (url || '').trim();
      if (!trimmed) return '';
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      return `https://${trimmed}`;
    }

    function getEvents() {
      return JSON.parse(localStorage.getItem('vacation_events') || '[]');
    }

    function saveEvents(events) {
      localStorage.setItem('vacation_events', JSON.stringify(events));
      renderTimeline();
    }

    const typeIcons = {
      FLIGHT: '✈️',
      TRAIN: '🚆',
      BUS: '🚌',
      ACTIVITY: '🏛️',
      HOTEL: '🏨'
    };

    function getTodayDate() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getEventStart(ev) {
      const time = ev.time && ev.time.length ? ev.time : '00:00';
      return new Date(`${ev.date}T${time}:00`);
    }

    function isUpcomingEvent(ev) {
      return getEventStart(ev).getTime() >= Date.now();
    }

    function sortEvents(events) {
      return [...events].sort((a, b) => {
        const byDateTime = (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''));
        if (byDateTime !== 0) return byDateTime;
        return (a.title || '').localeCompare(b.title || '');
      });
    }

    function filterEvents(events) {
      const today = getTodayDate();
      switch (currentFilter) {
        case 'TODAY':
          return events.filter(e => e.date === today);
        case 'UPCOMING':
          // Future (and not-yet-started today) only — never past events
          return events.filter(isUpcomingEvent);
        case 'FLIGHT':
        case 'TRAIN':
        case 'BUS':
        case 'ACTIVITY':
        case 'HOTEL':
          return events.filter(e => e.type === currentFilter);
        case 'ALL':
        default:
          return events;
      }
    }

    function formatDayLabel(dateStr) {
      const today = getTodayDate();
      if (dateStr === today) return 'Today';

      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const y = tomorrow.getFullYear();
      const m = String(tomorrow.getMonth() + 1).padStart(2, '0');
      const day = String(tomorrow.getDate()).padStart(2, '0');
      if (dateStr === `${y}-${m}-${day}`) return 'Tomorrow';

      const d = new Date(`${dateStr}T00:00:00`);
      return d.toLocaleDateString(undefined, {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function emptyFilterMessage() {
      if (currentFilter === 'TODAY') return 'No events scheduled for today.';
      if (currentFilter === 'UPCOMING') return 'No upcoming events.';
      return 'No events found in this category.';
    }

    function renderTimeline() {
      const events = sortEvents(getEvents());
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = '';

      const filtered = filterEvents(events);

      if (filtered.length === 0) {
        timeline.innerHTML = `<p class="text-center text-slate-500 py-8 text-sm">${emptyFilterMessage()}</p>`;
        return;
      }

      let lastDate = null;

      filtered.forEach(ev => {
        if (ev.date !== lastDate) {
          lastDate = ev.date;
          const heading = document.createElement('div');
          heading.className = 'relative pl-8 pt-2';
          heading.innerHTML = `
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">
              ${formatDayLabel(ev.date)}
            </p>
          `;
          timeline.appendChild(heading);
        }

        const item = document.createElement('div');
        item.className = 'relative pl-8 group';

        item.innerHTML = `
          <!-- Category Dot -->
          <div class="absolute left-1.5 top-1.5 w-5 h-5 rounded-full bg-slate-800 border-2 border-brand-500 flex items-center justify-center text-[10px]">
            ${typeIcons[ev.type] || '📌'}
          </div>

          <!-- Card Content -->
          <div onclick="openEventDetail('${ev.id}')" class="bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 rounded-xl p-4 transition space-y-2 cursor-pointer">
            <div class="flex items-start justify-between">
              <div>
                <span class="inline-block text-[10px] font-bold uppercase tracking-wider text-brand-500 px-2 py-0.5 rounded bg-brand-500/10 mb-1">
                  ${ev.time}${ev.endTime ? ' - ' + ev.endTime : ''}
                </span>
                <h3 class="font-semibold text-slate-100 text-base">${ev.title}</h3>
              </div>
              <div class="flex items-center space-x-1" onclick="event.stopPropagation()">
                <button onclick="editEvent('${ev.id}')" class="text-xs text-slate-400 hover:text-slate-200 p-1">✏️</button>
                <button onclick="deleteEvent('${ev.id}')" class="text-xs text-slate-400 hover:text-red-400 p-1">🗑️</button>
              </div>
            </div>

            ${ev.location ? `<p class="text-xs text-slate-300 flex items-center gap-1">📍 <span>${ev.location}</span></p>` : ''}
            ${ev.notes ? `<p class="text-xs text-slate-400 italic bg-slate-900/40 p-2 rounded-lg line-clamp-2">${ev.notes}</p>` : ''}

            <!-- Attachments Section -->
            <div class="pt-2 border-t border-slate-700/50 space-y-2" id="voucher-section-${ev.id}" onclick="event.stopPropagation()">
              <div id="voucher-status-${ev.id}" class="text-xs text-slate-400 space-y-1">Loading attachments...</div>
              <div class="flex items-center gap-1.5 justify-end">
                <button type="button" onclick="openLinkModal('${ev.id}')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg text-slate-200 border border-slate-600">🔗 Link</button>
                <label class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg cursor-pointer text-slate-200 border border-slate-600">
                  📎 File
                  <input type="file" class="hidden" accept="image/*,application/pdf" multiple onchange="uploadVoucher('${ev.id}', event)">
                </label>
              </div>
            </div>
          </div>
        `;
        timeline.appendChild(item);
        renderAttachments(ev.id);
      });
    }

    // Modal controls
    function openModal(editingEvent = null) {
      document.getElementById('eventModal').classList.remove('hidden');
      if (editingEvent) {
        document.getElementById('modalTitle').innerText = 'Edit Event';
        document.getElementById('eventId').value = editingEvent.id;
        document.getElementById('eventTitle').value = editingEvent.title;
        document.getElementById('eventType').value = editingEvent.type;
        document.getElementById('eventDate').value = editingEvent.date;
        document.getElementById('eventTime').value = editingEvent.time;
        document.getElementById('eventEndTime').value = editingEvent.endTime || '';
        document.getElementById('eventLocation').value = editingEvent.location || '';
        document.getElementById('eventNotes').value = editingEvent.notes || '';
      } else {
        document.getElementById('modalTitle').innerText = 'Add New Event';
        document.getElementById('eventForm').reset();
        document.getElementById('eventId').value = '';
      }
    }

    function closeModal() {
      document.getElementById('eventModal').classList.add('hidden');
    }

    function saveEvent(e) {
      e.preventDefault();
      const events = getEvents();
      const id = document.getElementById('eventId').value || Date.now().toString();

      const newEv = {
        id,
        title: document.getElementById('eventTitle').value,
        type: document.getElementById('eventType').value,
        date: document.getElementById('eventDate').value,
        time: document.getElementById('eventTime').value,
        endTime: document.getElementById('eventEndTime').value,
        location: document.getElementById('eventLocation').value,
        notes: document.getElementById('eventNotes').value
      };

      const index = events.findIndex(x => x.id === id);
      if (index >= 0) events[index] = newEv;
      else events.push(newEv);

      saveEvents(events);
      closeModal();
    }

    function editEvent(id) {
      const ev = getEvents().find(x => x.id === id);
      if (ev) openModal(ev);
    }

    function deleteEvent(id) {
      if (!confirm('Are you sure you want to delete this event?')) return;
      saveEvents(getEvents().filter(x => x.id !== id));
      deleteVoucherFromDB(id);
      if (currentDetailEventId === id) closeEventDetail();
    }

    const typeLabels = {
      FLIGHT: '✈️ Flight',
      TRAIN: '🚆 Train',
      BUS: '🚌 Bus',
      ACTIVITY: '🏛️ Activity/Sight',
      HOTEL: '🏨 Hotel'
    };

    function openEventDetail(id) {
      const ev = getEvents().find(x => x.id === id);
      if (!ev) return;

      currentDetailEventId = id;
      document.getElementById('detailTypeBadge').innerText = typeLabels[ev.type] || ev.type;
      document.getElementById('detailTitle').innerText = ev.title;
      document.getElementById('detailDate').innerText = ev.date;
      document.getElementById('detailTime').innerText = ev.endTime
        ? `${ev.time} – ${ev.endTime}`
        : ev.time;
      document.getElementById('detailLocation').innerText = ev.location || 'No location set';
      document.getElementById('detailNotes').innerText = ev.notes || 'No notes';
      document.getElementById('detailVoucherStatus').innerHTML = `<span class="text-xs text-slate-500">Loading...</span>`;
      document.getElementById('eventDetailModal').classList.remove('hidden');
      renderAttachments(id);
    }

    function closeEventDetail() {
      document.getElementById('eventDetailModal').classList.add('hidden');
      currentDetailEventId = null;
    }

    function editEventFromDetail() {
      if (!currentDetailEventId) return;
      const id = currentDetailEventId;
      closeEventDetail();
      editEvent(id);
    }

    function deleteEventFromDetail() {
      if (!currentDetailEventId) return;
      deleteEvent(currentDetailEventId);
    }

    function uploadVoucherFromDetail(event) {
      if (!currentDetailEventId) return;
      uploadVoucher(currentDetailEventId, event);
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-brand-600', 'text-white');
        b.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`filter-${cat}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-brand-600', 'text-white');
        activeBtn.classList.remove('text-slate-400');
      }
      renderTimeline();
    }

    // Attachments via IndexedDB (unlimited files + links per event)
    function getAttachmentsForEvent(eventId) {
      return new Promise((resolve) => {
        if (!db) return resolve([]);
        const tx = db.transaction('attachments', 'readonly');
        const req = tx.objectStore('attachments').index('eventId').getAll(eventId);
        req.onsuccess = () => {
          const items = (req.result || []).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          resolve(items);
        };
        req.onerror = () => resolve([]);
      });
    }

    function attachmentLabel(att) {
      if (att.kind === 'link') return att.label || att.url || 'Link';
      return att.fileName || 'File';
    }

    function jsStr(value) {
      return JSON.stringify(String(value ?? ''));
    }

    function renderAttachmentRows(attachments, { showDelete = false } = {}) {
      if (!attachments.length) {
        return `<span class="text-xs text-slate-500">No attachments yet</span>`;
      }

      return attachments.map(att => {
        const label = escapeHtml(attachmentLabel(att));
        const icon = att.kind === 'link' ? '🔗' : '📄';
        const idArg = jsStr(att.id);
        const openAction = att.kind === 'link'
          ? `openLinkAttachment(${idArg})`
          : `viewAttachment(${idArg})`;
        const deleteBtn = showDelete
          ? `<button type="button" onclick="deleteAttachment(${idArg})" class="text-slate-500 hover:text-red-400 px-1" title="Remove">✕</button>`
          : '';

        return `
          <div class="flex items-center justify-between gap-2">
            <button type="button" onclick="${openAction}" class="text-xs text-brand-500 font-medium hover:underline flex items-center gap-1 min-w-0 text-left">
              <span>${icon}</span>
              <span class="truncate">${label}</span>
            </button>
            ${deleteBtn}
          </div>
        `;
      }).join('');
    }

    async function renderAttachments(eventId) {
      const attachments = await getAttachmentsForEvent(eventId);
      const cardContainer = document.getElementById(`voucher-status-${eventId}`);
      if (cardContainer) {
        cardContainer.innerHTML = renderAttachmentRows(attachments, { showDelete: true });
      }
      if (currentDetailEventId === eventId) {
        const detailContainer = document.getElementById('detailVoucherStatus');
        if (detailContainer) {
          detailContainer.innerHTML = renderAttachmentRows(attachments, { showDelete: true });
        }
      }
    }

    function refreshAttachments(eventId) {
      renderAttachments(eventId);
    }

    function uploadVoucher(eventId, event) {
      const files = Array.from(event.target.files || []);
      if (!files.length || !db) return;

      let remaining = files.length;
      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const tx = db.transaction('attachments', 'readwrite');
          tx.objectStore('attachments').put({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            eventId,
            kind: 'file',
            fileName: file.name,
            fileType: file.type,
            dataUrl: e.target.result,
            createdAt: Date.now()
          });
          tx.oncomplete = () => {
            remaining -= 1;
            if (remaining <= 0) {
              refreshAttachments(eventId);
              event.target.value = '';
            }
          };
        };
        reader.readAsDataURL(file);
      });
    }

    function openLinkModal(eventId) {
      if (!eventId) return;
      document.getElementById('linkEventId').value = eventId;
      document.getElementById('linkForm').reset();
      document.getElementById('linkEventId').value = eventId;
      document.getElementById('linkModal').classList.remove('hidden');
    }

    function closeLinkModal() {
      document.getElementById('linkModal').classList.add('hidden');
    }

    function saveLinkAttachment(e) {
      e.preventDefault();
      if (!db) return;

      const eventId = document.getElementById('linkEventId').value;
      const url = normalizeUrl(document.getElementById('linkUrl').value);
      const label = document.getElementById('linkLabel').value.trim();
      if (!eventId || !url) return;

      const tx = db.transaction('attachments', 'readwrite');
      tx.objectStore('attachments').put({
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        eventId,
        kind: 'link',
        url,
        label,
        createdAt: Date.now()
      });
      tx.oncomplete = () => {
        closeLinkModal();
        refreshAttachments(eventId);
      };
    }

    function viewAttachment(attachmentId) {
      if (!db) return;
      const tx = db.transaction('attachments', 'readonly');
      const req = tx.objectStore('attachments').get(attachmentId);
      req.onsuccess = () => {
        const res = req.result;
        if (!res || res.kind !== 'file') return;

        const preview = document.getElementById('docPreviewContainer');
        document.getElementById('docModalTitle').innerText = res.fileName || 'Attachment';

        if ((res.fileType || '').startsWith('image/')) {
          preview.innerHTML = `<img src="${res.dataUrl}" class="max-w-full max-h-full rounded-lg object-contain">`;
        } else if (res.fileType === 'application/pdf') {
          preview.innerHTML = `<iframe src="${res.dataUrl}" class="w-full h-full rounded-lg"></iframe>`;
        } else {
          preview.innerHTML = `<a href="${res.dataUrl}" download="${escapeHtml(res.fileName || 'file')}" class="text-brand-500 underline">Download File</a>`;
        }

        document.getElementById('docModal').classList.remove('hidden');
      };
    }

    function openLinkAttachment(attachmentId) {
      if (!db) return;
      const tx = db.transaction('attachments', 'readonly');
      const req = tx.objectStore('attachments').get(attachmentId);
      req.onsuccess = () => {
        const res = req.result;
        if (!res || res.kind !== 'link' || !res.url) return;
        window.open(res.url, '_blank', 'noopener,noreferrer');
      };
    }

    function deleteAttachment(attachmentId) {
      if (!db || !confirm('Remove this attachment?')) return;
      const readTx = db.transaction('attachments', 'readonly');
      const getReq = readTx.objectStore('attachments').get(attachmentId);
      getReq.onsuccess = () => {
        const att = getReq.result;
        const delTx = db.transaction('attachments', 'readwrite');
        delTx.objectStore('attachments').delete(attachmentId);
        delTx.oncomplete = () => {
          if (att?.eventId) refreshAttachments(att.eventId);
        };
      };
    }

    function closeDocModal() {
      document.getElementById('docModal').classList.add('hidden');
    }

    function deleteVoucherFromDB(eventId) {
      if (!db) return;
      const tx = db.transaction(['attachments', 'vouchers'], 'readwrite');
      const attachments = tx.objectStore('attachments');
      const index = attachments.index('eventId');
      index.openCursor(IDBKeyRange.only(eventId)).onsuccess = (e) => {
        const cursor = e.target.result;
        if (!cursor) return;
        cursor.delete();
        cursor.continue();
      };
      // Also clear any legacy single-voucher record
      if (tx.objectStoreNames.contains('vouchers')) {
        tx.objectStore('vouchers').delete(eventId);
      }
    }

    // Export & Import Data Backup
    async function exportData() {
      const events = getEvents();
      const tx = db.transaction(['attachments', 'vouchers'], 'readonly');
      const attachmentsReq = tx.objectStore('attachments').getAll();
      const vouchersReq = tx.objectStore('vouchers').getAll();

      Promise.all([
        new Promise(resolve => { attachmentsReq.onsuccess = () => resolve(attachmentsReq.result || []); }),
        new Promise(resolve => { vouchersReq.onsuccess = () => resolve(vouchersReq.result || []); })
      ]).then(([attachments, vouchers]) => {
        const payload = JSON.stringify({ events, attachments, vouchers }, null, 2);
        const blob = new Blob([payload], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `vacation_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
      });
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          if (data.events) {
            localStorage.setItem('vacation_events', JSON.stringify(data.events));
          }

          const tx = db.transaction(['attachments', 'vouchers'], 'readwrite');
          const attachmentsStore = tx.objectStore('attachments');
          const vouchersStore = tx.objectStore('vouchers');

          if (Array.isArray(data.attachments)) {
            data.attachments.forEach(a => attachmentsStore.put(a));
          }

          // Support older backups that only had a single voucher per event
          if (Array.isArray(data.vouchers)) {
            data.vouchers.forEach(v => {
              vouchersStore.put(v);
              attachmentsStore.put({
                id: v.id || `legacy-${v.eventId}`,
                eventId: v.eventId,
                kind: 'file',
                fileName: v.fileName || 'Voucher',
                fileType: v.fileType || 'application/octet-stream',
                dataUrl: v.dataUrl || '',
                createdAt: v.createdAt || Date.now()
              });
            });
          }

          tx.oncomplete = () => {
            alert('Data and attachments restored successfully!');
            renderTimeline();
          };
        } catch (err) {
          alert('Invalid backup file.');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
