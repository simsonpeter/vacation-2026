<!DOCTYPE html>
<html lang="en" class="dark h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacation Dashboard 2026</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb' }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🇮🇹</span>
        <div>
          <h1 class="font-bold text-lg leading-tight">Summer Vacation 2026</h1>
          <p class="text-xs text-slate-400">Rome & Pisa | Aug 10 - Aug 15</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="exportData()" title="Backup / Export Data" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300">
          📥 Export
        </button>
        <label title="Restore / Import Data" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 cursor-pointer">
          📤 Import
          <input type="file" id="importInput" accept=".json" class="hidden" onchange="importData(event)">
        </label>
      </div>
    </div>
  </header>

  <!-- Filter & Actions Bar -->
  <main class="flex-1 max-w-3xl w-full mx-auto p-4 space-y-4 pb-24">
    <div class="flex items-center justify-between gap-2">
      <div class="flex space-x-1 bg-slate-800 p-1 rounded-xl border border-slate-700/50 overflow-x-auto">
        <button onclick="filterCategory('UPCOMING')" class="filter-btn active px-3 py-1.5 rounded-lg text-xs font-medium transition bg-brand-600 text-white whitespace-nowrap" id="filter-UPCOMING">Upcoming</button>
        <button onclick="filterCategory('TODAY')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition whitespace-nowrap" id="filter-TODAY">Today</button>
        <button onclick="filterCategory('ALL')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition whitespace-nowrap" id="filter-ALL">All</button>
      </div>

      <button onclick="openModal()" class="px-3 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-xs font-semibold text-white shadow-lg shadow-brand-500/20 whitespace-nowrap shrink-0">
        + Add Event
      </button>
    </div>

    <div class="flex space-x-1 bg-slate-800/60 p-1 rounded-xl border border-slate-700/40 overflow-x-auto w-fit max-w-full">
      <button onclick="filterCategory('FLIGHT')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition whitespace-nowrap" id="filter-FLIGHT">✈️ Flights</button>
      <button onclick="filterCategory('TRAIN')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition whitespace-nowrap" id="filter-TRAIN">🚆 Trains</button>
      <button onclick="filterCategory('STAY')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition whitespace-nowrap" id="filter-STAY">🏨 Stays</button>
      <button onclick="filterCategory('ACTIVITY')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition whitespace-nowrap" id="filter-ACTIVITY">🏛️ Sights</button>
    </div>

    <!-- Timeline Container -->
    <div id="timeline" class="space-y-4 relative before:absolute before:inset-0 before:left-4 before:w-0.5 before:bg-slate-800">
      <!-- Injected by JavaScript -->
    </div>
  </main>

  <!-- Add/Edit Event Modal -->
  <div id="eventModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-lg" id="modalTitle">Add New Event</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 text-xl font-bold">&times;</button>
      </div>
      <form id="eventForm" onsubmit="saveEvent(event)" class="space-y-3">
        <input type="hidden" id="eventId">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Title</label>
          <input type="text" id="eventTitle" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Type</label>
            <select id="eventType" onchange="updateFormForType()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
              <option value="FLIGHT">✈️ Flight</option>
              <option value="TRAIN">🚆 Train</option>
              <option value="BUS">🚌 Bus</option>
              <option value="ACTIVITY">🏛️ Activity/Sight</option>
              <option value="STAY">🏨 Stay (Hotel / Airbnb)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1" id="labelEventDate">Date</label>
            <input type="date" id="eventDate" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2" id="endDateRow">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1" id="labelEventEndDate">Check-out Date</label>
            <input type="date" id="eventEndDate" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
          </div>
          <div class="flex items-end pb-0.5">
            <p id="stayHint" class="text-[11px] text-slate-500 leading-snug">For Hotel / Airbnb stays, set check-in and check-out.</p>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1" id="labelEventTime">Start Time</label>
            <input type="time" id="eventTime" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1" id="labelEventEndTime">End / Return Time (Optional)</label>
            <input type="time" id="eventEndTime" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1" id="labelEventLocation">Location / Route</label>
          <input type="text" id="eventLocation" placeholder="e.g. Brussels -> Fiumicino" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1" id="labelEventAddress">Address</label>
          <input type="text" id="eventAddress" placeholder="e.g. full street address for Hotel / Airbnb" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Notes / Booking Refs</label>
          <textarea id="eventNotes" rows="2" placeholder="e.g. Booking ref, seat numbers, tips..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500"></textarea>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-slate-800 text-xs font-medium text-slate-300">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-xs font-medium text-white">Save Event</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Event Detail Full View Modal -->
  <div id="eventDetailModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 w-full sm:max-w-lg max-h-[90vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-start border-b border-slate-800 pb-3 gap-3">
        <div class="min-w-0">
          <span id="detailTypeBadge" class="inline-block text-[10px] font-bold uppercase tracking-wider text-brand-500 px-2 py-0.5 rounded bg-brand-500/10 mb-2"></span>
          <h3 class="font-bold text-lg leading-snug" id="detailTitle"></h3>
        </div>
        <button onclick="closeEventDetail()" class="text-slate-400 hover:text-slate-200 text-xl font-bold shrink-0">&times;</button>
      </div>

      <div class="space-y-3 text-sm">
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700/50">
            <p class="text-[10px] uppercase tracking-wider text-slate-500 font-medium mb-1" id="detailDateLabel">Date</p>
            <p id="detailDate" class="text-slate-100 font-medium"></p>
          </div>
          <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700/50">
            <p class="text-[10px] uppercase tracking-wider text-slate-500 font-medium mb-1" id="detailTimeLabel">Time</p>
            <p id="detailTime" class="text-slate-100 font-medium"></p>
          </div>
        </div>

        <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700/50">
          <p class="text-[10px] uppercase tracking-wider text-slate-500 font-medium mb-1">Location / Route</p>
          <p id="detailLocation" class="text-slate-100"></p>
        </div>

        <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700/50">
          <p class="text-[10px] uppercase tracking-wider text-slate-500 font-medium mb-1">Address</p>
          <p id="detailAddress" class="text-slate-100 whitespace-pre-wrap"></p>
          <a id="detailAddressMap" href="#" target="_blank" rel="noopener noreferrer" class="hidden inline-block mt-2 text-xs text-brand-500 hover:underline">Open in Maps</a>
        </div>

        <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700/50">
          <p class="text-[10px] uppercase tracking-wider text-slate-500 font-medium mb-1">Notes / Booking Refs</p>
          <p id="detailNotes" class="text-slate-300 whitespace-pre-wrap"></p>
        </div>

        <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700/50">
          <div class="flex items-center justify-between gap-2 mb-2">
            <p class="text-[10px] uppercase tracking-wider text-slate-500 font-medium">Attachments</p>
            <div class="flex items-center gap-1.5">
              <button type="button" onclick="openLinkModal(currentDetailEventId)" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg text-slate-200 border border-slate-600">🔗 Link</button>
              <label class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg cursor-pointer text-slate-200 border border-slate-600">
                📎 File
                <input type="file" id="detailVoucherInput" class="hidden" accept="image/*,application/pdf" multiple onchange="uploadVoucherFromDetail(event)">
              </label>
            </div>
          </div>
          <div id="detailVoucherStatus" class="text-xs text-slate-400 space-y-1.5">Loading...</div>
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-2 border-t border-slate-800">
        <button type="button" onclick="deleteEventFromDetail()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-red-900/40 text-xs font-medium text-red-400">Delete</button>
        <button type="button" onclick="editEventFromDetail()" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-xs font-medium text-white">Edit Event</button>
      </div>
    </div>
  </div>

  <!-- Add Link Modal -->
  <div id="linkModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[60] flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-lg">Add Link</h3>
        <button onclick="closeLinkModal()" class="text-slate-400 hover:text-slate-200 text-xl font-bold">&times;</button>
      </div>
      <form id="linkForm" onsubmit="saveLinkAttachment(event)" class="space-y-3">
        <input type="hidden" id="linkEventId">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">URL</label>
          <input type="text" id="linkUrl" required inputmode="url" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Label (optional)</label>
          <input type="text" id="linkLabel" placeholder="e.g. Booking confirmation" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeLinkModal()" class="px-4 py-2 rounded-lg bg-slate-800 text-xs font-medium text-slate-300">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-xs font-medium text-white">Save Link</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Document Preview Modal -->
  <div id="docModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[70] flex flex-col hidden">
    <div class="flex items-center justify-between gap-3 p-4 bg-slate-900 border-b border-slate-800">
      <h3 class="font-bold text-sm truncate" id="docModalTitle">Attachment Preview</h3>
      <div class="flex items-center gap-2 shrink-0">
        <a id="docOpenExternal" href="#" target="_blank" rel="noopener noreferrer" class="hidden text-xs text-brand-500 hover:underline">Open</a>
        <a id="docDownloadLink" href="#" download class="hidden text-xs text-slate-300 hover:text-white">Download</a>
        <button onclick="closeDocModal()" class="text-slate-400 hover:text-white font-bold text-lg leading-none">&times;</button>
      </div>
    </div>
    <div class="flex-1 p-2 flex items-center justify-center overflow-auto" id="docPreviewContainer">
      <!-- Rendered image or iframe -->
    </div>
  </div>

  <!-- IndexedDB & App Script -->
  <script>
    // Initial pre-loaded itinerary data
    const initialEvents = [
      { id: '1', title: 'Brussels to Rome Fiumicino Flight', type: 'FLIGHT', date: '2026-08-10', time: '08:50', location: 'Brussels Airport (BRU) ✈️ Fiumicino (FCO)', address: 'Via dell\'Aeroporto di Fiumicino, 00054 Fiumicino RM, Italy', notes: 'Check-in online 24h before. Take Leonardo Express train upon arrival.' },
      { id: 'stay-rome', title: 'Rome Airbnb Stay', type: 'STAY', date: '2026-08-10', time: '15:00', endDate: '2026-08-15', endTime: '11:00', location: 'Airbnb — Centro Storico', address: 'Via dei Serpenti, 00184 Roma RM, Italy', notes: 'Check-in after 15:00. Self check-in with lockbox code in confirmation email.' },
      { id: '2', title: 'Colosseum, Palatine Hill & Roman Forum', type: 'ACTIVITY', date: '2026-08-11', time: '10:30', location: 'Piazza del Colosseo, Roma', address: 'Piazza del Colosseo, 1, 00184 Roma RM, Italy', notes: 'Arrive 25 mins early for security checks.' },
      { id: '3', title: 'Day Trip to Pisa', type: 'TRAIN', date: '2026-08-13', time: '06:42', endTime: '20:38', location: 'Roma Termini ↔ Pisa Centrale', address: 'Piazza dei Miracoli, 56126 Pisa PI, Italy', notes: 'Outbound train at 06:42. Return train leaves Pisa at 20:38.' },
      { id: '4', title: 'Rome Fiumicino to Brussels Flight', type: 'FLIGHT', date: '2026-08-15', time: '18:10', location: 'Fiumicino (FCO) ✈️ Brussels (BRU)', address: 'Via dell\'Aeroporto di Fiumicino, 00054 Fiumicino RM, Italy', notes: 'Ferragosto holiday! Expect crowds; arrive at FCO airport by 15:30.' }
    ];

    let currentFilter = 'UPCOMING';
    let currentDetailEventId = null;
    let db = null;
    const ATTACHMENTS_KEY = 'vacation_attachments';

    // Attachments are stored in localStorage (reliable + exportable).
    // IndexedDB is only used to migrate older voucher/attachment data once.
    function getAllAttachments() {
      try {
        const parsed = JSON.parse(localStorage.getItem(ATTACHMENTS_KEY) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveAllAttachments(list) {
      localStorage.setItem(ATTACHMENTS_KEY, JSON.stringify(list));
    }

    function upsertAttachments(newItems) {
      if (!newItems.length) return;
      const map = new Map(getAllAttachments().map(a => [a.id, a]));
      newItems.forEach(item => map.set(item.id, item));
      saveAllAttachments([...map.values()]);
    }

    function migrateFromIndexedDB() {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve();

        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          resolve();
        };

        // Don't block the UI if IDB is slow/broken
        setTimeout(finish, 1500);

        try {
          const request = indexedDB.open('VacationAppDB', 2);
          request.onerror = () => finish();
          request.onblocked = () => finish();
          request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains('vouchers')) {
              db.createObjectStore('vouchers', { keyPath: 'eventId' });
            }
            if (!db.objectStoreNames.contains('attachments')) {
              const store = db.createObjectStore('attachments', { keyPath: 'id' });
              store.createIndex('eventId', 'eventId', { unique: false });
            }
          };
          request.onsuccess = (e) => {
            db = e.target.result;
            // Only migrate if local attachments are empty
            if (getAllAttachments().length > 0) return finish();

            const storeNames = [...db.objectStoreNames];
            const wants = ['attachments', 'vouchers'].filter(n => storeNames.includes(n));
            if (!wants.length) return finish();

            try {
              const tx = db.transaction(wants, 'readonly');
              const migrated = [];

              const collect = (items) => {
                (items || []).forEach(v => {
                  if (!v) return;
                  if (v.kind === 'link' || v.kind === 'file') {
                    migrated.push(v);
                  } else if (v.eventId && v.dataUrl) {
                    migrated.push({
                      id: v.id || `legacy-${v.eventId}`,
                      eventId: v.eventId,
                      kind: 'file',
                      fileName: v.fileName || 'Voucher',
                      fileType: v.fileType || 'application/octet-stream',
                      dataUrl: v.dataUrl,
                      createdAt: v.createdAt || Date.now()
                    });
                  }
                });
              };

              let pending = wants.length;
              wants.forEach((name) => {
                const req = tx.objectStore(name).getAll();
                req.onsuccess = () => {
                  collect(req.result);
                  pending -= 1;
                  if (pending <= 0) {
                    if (migrated.length) upsertAttachments(migrated);
                    finish();
                  }
                };
                req.onerror = () => {
                  pending -= 1;
                  if (pending <= 0) finish();
                };
              });
              tx.onerror = () => finish();
            } catch {
              finish();
            }
          };
        } catch {
          finish();
        }
      });
    }

    async function initApp() {
      if (!localStorage.getItem('vacation_events')) {
        localStorage.setItem('vacation_events', JSON.stringify(initialEvents));
      }
      // If events were wiped somehow, restore the starter itinerary
      try {
        const existing = JSON.parse(localStorage.getItem('vacation_events') || '[]');
        if (!Array.isArray(existing) || existing.length === 0) {
          localStorage.setItem('vacation_events', JSON.stringify(initialEvents));
        } else {
          // Backfill address / stay seed data on known starter events if missing
          const seedById = Object.fromEntries(initialEvents.map(e => [e.id, e]));
          let changed = false;
          const merged = existing.map(ev => {
            const seed = seedById[ev.id];
            let next = ev;
            if (seed?.address && !ev.address) {
              changed = true;
              next = { ...next, address: seed.address };
            }
            if (ev.type === 'HOTEL') {
              changed = true;
              next = { ...next, type: 'STAY' };
            }
            return next;
          });

          // Ensure the Rome stay exists for existing users
          if (!merged.some(e => e.id === 'stay-rome')) {
            const stay = seedById['stay-rome'];
            if (stay) {
              merged.push(stay);
              changed = true;
            }
          }

          if (changed) localStorage.setItem('vacation_events', JSON.stringify(merged));
        }
      } catch {
        localStorage.setItem('vacation_events', JSON.stringify(initialEvents));
      }

      await migrateFromIndexedDB();
      updateFormForType();
      renderTimeline();
    }

    // Start app immediately; IDB migration happens in background-friendly await
    initApp();

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeUrl(url) {
      const trimmed = (url || '').trim();
      if (!trimmed) return '';
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      return `https://${trimmed}`;
    }

    function getEvents() {
      return JSON.parse(localStorage.getItem('vacation_events') || '[]');
    }

    function saveEvents(events) {
      localStorage.setItem('vacation_events', JSON.stringify(events));
      renderTimeline();
    }

    const typeIcons = {
      FLIGHT: '✈️',
      TRAIN: '🚆',
      BUS: '🚌',
      ACTIVITY: '🏛️',
      STAY: '🏨',
      HOTEL: '🏨'
    };

    function isStayType(ev) {
      return ev?.type === 'STAY' || ev?.type === 'HOTEL';
    }

    function getTodayDate() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function padTime(time) {
      const raw = (time || '00:00').trim();
      const parts = raw.split(':');
      const hh = String(parts[0] || '0').padStart(2, '0');
      const mm = String(parts[1] || '0').padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function getNowTime() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function isUpcomingEvent(ev) {
      if (!ev || !ev.date) return false;
      const today = getTodayDate();
      const nowTime = getNowTime();

      // Stays stay visible until check-out ends
      if (isStayType(ev) && ev.endDate) {
        if (ev.endDate > today) return true;
        if (ev.endDate < today) return false;
        return padTime(ev.endTime || '23:59') >= nowTime;
      }

      // String compare YYYY-MM-DD — avoids Invalid Date / timezone traps
      if (ev.date > today) return true;
      if (ev.date < today) return false;
      return padTime(ev.time) >= nowTime;
    }

    function isTodayEvent(ev) {
      const today = getTodayDate();
      if (isStayType(ev) && ev.endDate) {
        return ev.date <= today && ev.endDate >= today;
      }
      return ev.date === today;
    }

    function sortEvents(events) {
      return [...events].sort((a, b) => {
        const byDateTime = (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''));
        if (byDateTime !== 0) return byDateTime;
        return (a.title || '').localeCompare(b.title || '');
      });
    }

    function filterEvents(events) {
      switch (currentFilter) {
        case 'TODAY':
          return events.filter(isTodayEvent);
        case 'UPCOMING':
          // Future / active events only — never finished past events
          return events.filter(isUpcomingEvent);
        case 'STAY':
          return events.filter(isStayType);
        case 'FLIGHT':
        case 'TRAIN':
        case 'BUS':
        case 'ACTIVITY':
        case 'HOTEL':
          return events.filter(e => e.type === currentFilter);
        case 'ALL':
        default:
          return events;
      }
    }

    function updateFormForType() {
      const type = document.getElementById('eventType').value;
      const stay = type === 'STAY' || type === 'HOTEL';
      const endDateRow = document.getElementById('endDateRow');

      document.getElementById('labelEventDate').innerText = stay ? 'Check-in Date' : 'Date';
      document.getElementById('labelEventTime').innerText = stay ? 'Check-in Time' : 'Start Time';
      document.getElementById('labelEventEndTime').innerText = stay ? 'Check-out Time' : 'End / Return Time (Optional)';
      document.getElementById('labelEventLocation').innerText = stay ? 'Property / Stay Name' : 'Location / Route';
      document.getElementById('labelEventAddress').innerText = stay ? 'Stay Address' : 'Address';

    function formatDayLabel(dateStr) {
      const today = getTodayDate();
      if (dateStr === today) return 'Today';

      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const y = tomorrow.getFullYear();
      const m = String(tomorrow.getMonth() + 1).padStart(2, '0');
      const day = String(tomorrow.getDate()).padStart(2, '0');
      if (dateStr === `${y}-${m}-${day}`) return 'Tomorrow';

      const d = new Date(`${dateStr}T00:00:00`);
      return d.toLocaleDateString(undefined, {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function emptyFilterMessage() {
      if (currentFilter === 'TODAY') return 'No events scheduled for today.';
      if (currentFilter === 'UPCOMING') return 'No upcoming events.';
      return 'No events found in this category.';

            <div class="flex items-start justify-between">

                  ${isStayType(ev) && ev.endDate
                    ? `${ev.date} ${ev.time || ''} → ${ev.endDate} ${ev.endTime || ''}`.trim()

            ${ev.address ? `<p class="text-xs ${isStayType(ev) ? 'text-slate-200' : 'text-slate-400'} flex items-start gap-1">🏠 <span class="line-clamp-2">${escapeHtml(ev.address)}</span></p>` : ''}

                <label class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg cursor-pointer text-slate-200 border border-slate-600">

        title: document.getElementById('eventTitle').value,

        endDate: document.getElementById('eventEndDate').value,

      closeModal();

    // Attachments (unlimited files + links) — localStorage-backed
    function getAttachmentsForEvent(eventId) {

        .filter(a => a.eventId === eventId)
        .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

    function attachmentLabel(att) {
      if (att.kind === 'link') return att.label || att.url || 'Link';
      return att.fileName || 'File';
    }

    function jsStr(value) {
      return JSON.stringify(String(value ?? ''));
    }

    function renderAttachmentRows(attachments, { showDelete = false } = {}) {
      if (!attachments.length) {
        return `<span class="text-xs text-slate-500">No attachments yet</span>`;
      }

      return attachments.map(att => {
        const label = escapeHtml(attachmentLabel(att));
        const icon = att.kind === 'link' ? '🔗' : '📄';
        // Use single-quoted HTML attrs so JSON string args with " don't break onclick
        const idArg = jsStr(att.id);
        const openAction = att.kind === 'link'
          ? `openLinkAttachment(${idArg})`
          : `viewAttachment(${idArg})`;
        const deleteBtn = showDelete
          ? `<button type="button" onclick='deleteAttachment(${idArg})' class="text-slate-500 hover:text-red-400 px-1" title="Remove">✕</button>`
          : '';

        return `
          <div class="flex items-center justify-between gap-2">
            <button type="button" onclick='${openAction}' class="text-xs text-brand-500 font-medium hover:underline flex items-center gap-1 min-w-0 text-left">
              <span>${icon}</span>
              <span class="truncate">${label}</span>
            </button>
            ${deleteBtn}
          </div>
        `;
      }).join('');

    function renderAttachments(eventId) {
      const attachments = getAttachmentsForEvent(eventId);
      const cardContainer = document.getElementById(`voucher-status-${eventId}`);
      if (cardContainer) {
        cardContainer.innerHTML = renderAttachmentRows(attachments, { showDelete: true });
      }
      if (currentDetailEventId === eventId) {
        const detailContainer = document.getElementById('detailVoucherStatus');
        if (detailContainer) {
          detailContainer.innerHTML = renderAttachmentRows(attachments, { showDelete: true });
        }
      }

    function refreshAttachments(eventId) {
      renderAttachments(eventId);
    }

    function newAttachmentId() {
      return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function persistAttachment(att) {
      try {
        upsertAttachments([att]);
        return true;
      } catch (err) {
        console.error(err);
        alert('Could not save attachment. The file may be too large for browser storage.');
        return false;
      }
    }

    function uploadVoucher(eventId, event) {
      const input = event.target;
      const files = Array.from(input.files || []);
      if (!files.length) return;

      const pending = [];
      let remaining = files.length;
      let failed = 0;

      const finishIfDone = () => {
        if (remaining > 0) return;
        if (pending.length) {
          try {
            upsertAttachments(pending);
            refreshAttachments(eventId);
          } catch (err) {
            console.error(err);
            alert('Could not save one or more files. They may be too large for browser storage.');
          }
        } else if (failed) {
          alert('Could not read the selected files.');
        }
        input.value = '';
      };

      files.forEach((file) => {
        const reader = new FileReader();
        reader.onerror = () => {
          failed += 1;
          remaining -= 1;
          finishIfDone();
        };
        reader.onload = function(e) {
          pending.push({
            id: newAttachmentId(),
            eventId,
            kind: 'file',
            fileName: file.name,
            fileType: file.type || guessMimeFromName(file.name),
            dataUrl: e.target.result,
            createdAt: Date.now()
          });
          remaining -= 1;
          finishIfDone();
        };
        reader.readAsDataURL(file);
      });
    }

    function guessMimeFromName(name = '') {
      const lower = name.toLowerCase();
      if (lower.endsWith('.pdf')) return 'application/pdf';
      if (lower.endsWith('.png')) return 'image/png';
      if (lower.endsWith('.jpg') || lower.endsWith('.jpeg')) return 'image/jpeg';
      if (lower.endsWith('.gif')) return 'image/gif';
      if (lower.endsWith('.webp')) return 'image/webp';
      if (lower.endsWith('.txt')) return 'text/plain';
      return 'application/octet-stream';
    }

    function dataUrlToBlob(dataUrl) {
      const parts = String(dataUrl || '').split(',');
      if (parts.length < 2) throw new Error('Invalid file data');
      const header = parts[0];
      const data = parts.slice(1).join(',');
      const mime = (header.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
      const isBase64 = /;base64/i.test(header);
      if (isBase64) {
        const binary = atob(data);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new Blob([bytes], { type: mime });
      }
      return new Blob([decodeURIComponent(data)], { type: mime });
    }

    function revokePreviewObjectUrl() {
      const preview = document.getElementById('docPreviewContainer');
      if (preview?.dataset.objectUrl) {
        URL.revokeObjectURL(preview.dataset.objectUrl);
        delete preview.dataset.objectUrl;
      }
    }

    function openLinkModal(eventId) {
      if (!eventId) return;
      document.getElementById('linkForm').reset();
      document.getElementById('linkEventId').value = eventId;
      document.getElementById('linkModal').classList.remove('hidden');
    }

    function closeLinkModal() {
      document.getElementById('linkModal').classList.add('hidden');
    }

    function saveLinkAttachment(e) {
      e.preventDefault();

      const eventId = document.getElementById('linkEventId').value;
      const url = normalizeUrl(document.getElementById('linkUrl').value);
      const label = document.getElementById('linkLabel').value.trim();
      if (!eventId || !url) return;

      const ok = persistAttachment({
        id: newAttachmentId(),
        eventId,
        kind: 'link',
        url,
        label,
        createdAt: Date.now()
      });
      if (!ok) return;
      closeLinkModal();
      refreshAttachments(eventId);
    }

    function viewAttachment(attachmentId) {
      const res = getAllAttachments().find(a => a.id === attachmentId);
      if (!res) return;
      if (res.kind === 'link') {
        openLinkAttachment(attachmentId);
        return;
      }
      if (!res.dataUrl) {
        alert('This attachment has no file data. Please attach it again.');
        return;
      }

      revokePreviewObjectUrl();

      const preview = document.getElementById('docPreviewContainer');
      const openExternal = document.getElementById('docOpenExternal');
      const downloadLink = document.getElementById('docDownloadLink');
      document.getElementById('docModalTitle').innerText = res.fileName || 'Attachment';
      preview.innerHTML = '';

      try {
        const blob = dataUrlToBlob(res.dataUrl);
        const objectUrl = URL.createObjectURL(blob);
        preview.dataset.objectUrl = objectUrl;

        const type = res.fileType || blob.type || guessMimeFromName(res.fileName);
        const fileName = res.fileName || 'file';

        openExternal.href = objectUrl;
        openExternal.classList.remove('hidden');
        downloadLink.href = objectUrl;
        downloadLink.download = fileName;
        downloadLink.classList.remove('hidden');

        if (type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = objectUrl;
          img.alt = fileName;
          img.className = 'max-w-full max-h-full rounded-lg object-contain';
          preview.appendChild(img);
        } else if (type === 'application/pdf' || fileName.toLowerCase().endsWith('.pdf')) {
          const iframe = document.createElement('iframe');
          iframe.src = objectUrl;
          iframe.title = fileName;
          iframe.className = 'w-full h-full min-h-[70vh] rounded-lg bg-white';
          preview.appendChild(iframe);
        } else if (type.startsWith('text/')) {
          blob.text().then((text) => {
            const pre = document.createElement('pre');
            pre.className = 'w-full max-w-3xl text-xs text-slate-200 whitespace-pre-wrap break-words bg-slate-900/80 p-4 rounded-lg';
            pre.textContent = text;
            preview.appendChild(pre);
          }).catch(() => {
            const link = document.createElement('a');
            link.href = objectUrl;
            link.download = fileName;
            link.className = 'text-brand-500 underline text-sm';
            link.textContent = `Download ${fileName}`;
            preview.appendChild(link);
          });
        } else {
          const wrap = document.createElement('div');
          wrap.className = 'text-center space-y-3';
          const link = document.createElement('a');
          link.href = objectUrl;
          link.download = fileName;
          link.className = 'inline-block text-brand-500 underline text-sm';
          link.textContent = `Download ${fileName}`;
          wrap.appendChild(link);
          preview.appendChild(wrap);
        }

        document.getElementById('docModal').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        alert('Could not open this attachment. Please attach the file again.');
      }
    }

    function openLinkAttachment(attachmentId) {
      const res = getAllAttachments().find(a => a.id === attachmentId);
      if (!res || !res.url) return;
      window.open(res.url, '_blank', 'noopener,noreferrer');

    function deleteAttachment(attachmentId) {
      if (!confirm('Remove this attachment?')) return;
      const all = getAllAttachments();

      saveAllAttachments(all.filter(a => a.id !== attachmentId));

    // Export & Import Data Backup
    async function exportData() {
      const events = getEvents();
      const attachments = getAllAttachments();
      const payload = JSON.stringify({ events, attachments }, null, 2);
      const blob = new Blob([payload], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `vacation_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          if (data.events) {
            localStorage.setItem('vacation_events', JSON.stringify(data.events));
          }

          const imported = [];
          if (Array.isArray(data.attachments)) {
            data.attachments.forEach(a => imported.push(a));
          }
          // Support older backups that only had a single voucher per event
          if (Array.isArray(data.vouchers)) {
            data.vouchers.forEach(v => {
              imported.push({
                id: v.id || `legacy-${v.eventId}`,
                eventId: v.eventId,
                kind: 'file',
                fileName: v.fileName || 'Voucher',
                fileType: v.fileType || 'application/octet-stream',
                dataUrl: v.dataUrl || '',
                createdAt: v.createdAt || Date.now()
              });
            });
          }
          if (imported.length) upsertAttachments(imported);

          alert('Data and attachments restored successfully!');
          renderTimeline();
        } catch (err) {
          alert('Invalid backup file.');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
